<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Katip</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        color-scheme: light dark;
        background: light-dark(#f5f5f7, #0b0b0d);
      }

      /* With system-ui first, Chrome may fill in Japanese glyphs from a serif face, depending on
         the language settings. So Japanese sans-serif faces come before system-ui, and every
         element gets them directly, since inputs and buttons don't inherit the font */
      *,
      *::before,
      *::after {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
