<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotlight</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        color-scheme: light dark;
        background: Canvas;
      }

      /* system-ui を先頭に置くと、Chrome は日本語の字形を言語設定に応じた明朝体で補うことがある。
         日本語のゴシック体を system-ui より先に名指しし、入力欄やボタンにも継承させずに直接指定する */
      *,
      *::before,
      *::after {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
