<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Katip 検証ページ</title>
    <style>
      :root {
        color-scheme: light dark;
        --page-bg: #e7e9ec;
        --page-text: #2a2e33;
        --page-muted: #6b7178;
        --page-panel: #ffffff;
        --page-border: rgb(0 0 0 / 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #17191c;
          --page-text: #e6e8ea;
          --page-muted: #9aa0a6;
          --page-panel: #222529;
          --page-border: rgb(255 255 255 / 0.1);
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior-x: none;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--page-bg);
        color: var(--page-text);
        font:
          13px/1.4 system-ui,
          -apple-system,
          "Hiragino Sans",
          sans-serif;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--page-border);
      }

      .toolbar h1 {
        margin: 0;
        font-size: 13px;
      }

      .toolbar nav {
        display: flex;
        gap: 4px;
      }

      .toolbar a {
        padding: 3px 10px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
      }

      .toolbar a[aria-current="page"] {
        background: var(--page-panel);
        box-shadow: 0 0 0 1px var(--page-border);
      }

      .toolbar .hint {
        color: var(--page-muted);
        font-size: 12px;
      }

      .stage {
        display: flex;
        gap: 16px;
        min-height: 0;
        padding: 16px;
      }

      #frame {
        flex: none;
        width: 360px;
        height: 100%;
        overflow: hidden;
        border-radius: 10px;
        box-shadow:
          0 0 0 1px var(--page-border),
          0 8px 24px rgb(0 0 0 / 0.12);
      }

      #frame[data-state="unavailable"] {
        box-sizing: border-box;
        padding: 24px;
        background: var(--page-panel);
        line-height: 1.6;
      }

      .log {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .log h2 {
        margin: 0;
        color: var(--page-muted);
        font-size: 12px;
        font-weight: 600;
      }

      #command-log {
        flex: 1;
        margin: 0;
        padding: 8px 8px 8px 32px;
        overflow: auto;
        border-radius: 8px;
        background: var(--page-panel);
        font:
          11.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <h1>Katip 検証ページ</h1>
      <nav aria-label="データの出どころ">
        <a data-mode="fixture">フィクスチャ</a>
        <a data-mode="extension">実際の拡張</a>
      </nav>
      <span class="hint">拡張 ID: <code id="extension-id"></code></span>
    </header>
    <main class="stage">
      <div id="frame"></div>
      <section class="log" aria-labelledby="log-heading">
        <h2 id="log-heading">送ったコマンド（新しい順）</h2>
        <ol id="command-log" reversed></ol>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
