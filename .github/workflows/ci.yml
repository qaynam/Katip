name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # ランナーにある Google Chrome は --load-extension を受け付けず、Playwright が headless で
      # 起動する Headless Shell は拡張を読み込めない
      - name: Chrome for Testing を入れる
        run: |
          chrome=$(pnpm dlx @puppeteer/browsers@3.2.6 install chrome@stable --path "$RUNNER_TEMP/chrome" --format '{{path}}')
          "$chrome" --version
          echo "KATIP_E2E_CHROME=$chrome" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: .e2e/results
          # 既定では . で始まるディレクトリを上げないので、.e2e/ の中身が空になる
          include-hidden-files: true
          retention-days: 14
