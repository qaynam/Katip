name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      # Bundles the website's Worker against the build as a deploy would, without credentials
      - run: pnpm --filter @katip/web exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Split view exists only from Chrome 155, and the browser behaves differently with and without
        # it (the split-related scenarios and contracts skip themselves where it is absent). 149 stands
        # in for the Chrome versions without split view that the extension still supports
        chrome: [stable, "149"]
    name: e2e (chrome ${{ matrix.chrome }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Not the runner's Google Chrome: it rejects --load-extension. Not Playwright's headless
      # Chromium either: that is the Headless Shell, which cannot load extensions
      - name: Install Chrome for Testing
        env:
          CHROME: ${{ matrix.chrome }}
        run: |
          chrome=$(pnpm dlx @puppeteer/browsers@3.2.6 install "chrome@$CHROME" --path "$RUNNER_TEMP/chrome" --format '{{path}}')
          "$chrome" --version
          echo "KATIP_E2E_CHROME=$chrome" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-chrome-${{ matrix.chrome }}
          path: apps/extension/.e2e/results
          # Hidden directories are skipped by default, which would upload .e2e/ empty
          include-hidden-files: true
          retention-days: 14

  # Every push to main deploys rather than only changes under apps/web/: the site is also built from
  # the store screenshots, the brand assets and PRIVACY.md, and wrangler uploads only what changed
  deploy-web:
    needs: check
    # Skipped until the repository names a Cloudflare account, so forks don't fail here
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website
      url: https://katip.qaynam.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a job holding the Cloudflare token: a cache saved by another run must
      # not run code here
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: pnpm deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
