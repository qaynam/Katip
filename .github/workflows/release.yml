name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Check the tag against the package.json version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a job with write access: a cache saved by another run must not end up in the zip we ship
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: pnpm package
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" ".release/katip-$VERSION.zip"
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
