name: Chrome Web Store

on:
  # Not on a release published on GitHub's page as well, unlike release.yml: that can come after
  # the tag was pushed, and the store refuses a version it already has. Run this by hand for a tag
  # made there
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      submit:
        description: What to do once the tag's version is uploaded
        type: choice
        options:
          - publish when approved
          - stage when approved
          - upload only
        default: publish when approved

permissions:
  contents: read

# Not one group per tag, unlike release.yml: the store takes one submission of the item at a time,
# so two versions sent together would trip over each other
concurrency:
  group: chrome-web-store

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Check the tag against the extension's version
        run: |
          version=$(node -p 'require("./apps/extension/package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the extension's version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Checked here rather than by the upload: that waits for CI first
      - name: Check that the store's item and credentials are all set
        if: vars.CHROME_WEB_STORE_ITEM_ID != ''
        env:
          CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          CHROME_WEB_STORE_SERVICE_ACCOUNT: ${{ vars.CHROME_WEB_STORE_SERVICE_ACCOUNT }}
          CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          unset=0
          for name in CHROME_WEB_STORE_PUBLISHER_ID CHROME_WEB_STORE_SERVICE_ACCOUNT CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository variable $name isn't set"
              unset=1
            fi
          done
          exit "$unset"

  package:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache for a zip that ships: a cache saved by another run must not end up in it
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: pnpm package:store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-web-store-package
          path: apps/extension/.release/katip-${{ needs.version.outputs.version }}-chrome-web-store.zip
          if-no-files-found: error

  # Not before the item exists: the API can't create one, so the first version is uploaded by hand
  # in the Developer Dashboard (the package job's zip will do), and only then is the item's ID known
  ci:
    needs: version
    if: vars.CHROME_WEB_STORE_ITEM_ID != ''
    uses: ./.github/workflows/ci.yml

  upload:
    needs: [version, ci, package]
    if: vars.CHROME_WEB_STORE_ITEM_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not ./.github/actions/setup, nor a build here: installing and building run the code of every
      # dependency, and in this job that code could ask GitHub for a token to sign in to Google with
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-web-store-package
          path: ${{ runner.temp }}/package
      # Workload Identity Federation rather than a service account key: there is no long-lived
      # secret to leak, and Google can be set to take tokens only from this workflow on a tag
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_WEB_STORE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload the zip to the store
        env:
          CHROME_WEB_STORE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          CHROME_WEB_STORE_ITEM_ID: ${{ vars.CHROME_WEB_STORE_ITEM_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: node apps/extension/scripts/send-to-chrome-web-store.ts upload "$RUNNER_TEMP/package/katip-$VERSION-chrome-web-store.zip"
      - name: Submit the version for review
        if: inputs.submit != 'upload only'
        env:
          CHROME_WEB_STORE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          CHROME_WEB_STORE_ITEM_ID: ${{ vars.CHROME_WEB_STORE_ITEM_ID }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$SUBMIT" = "stage when approved" ]; then
            node apps/extension/scripts/send-to-chrome-web-store.ts publish --staged
          else
            node apps/extension/scripts/send-to-chrome-web-store.ts publish
          fi
